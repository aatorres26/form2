<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Formulario para excursión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <style>
    :root { --verde: #2e7d32; --verde-claro: #e8f5e9; --lava: #ff6a1a; }
    body { background: #f4f1ec; }

    /* ---------- Portada con volcán ---------- */
    .hero {
      --imagen-portada: url('portada.jpg');
      position: relative;
      height: 340px;
      overflow: hidden;
      color: #fff;
      /* degradado de respaldo si la imagen no carga */
      background: linear-gradient(180deg, #1b2a49 0%, #6a4c93 45%, #ff9a5a 100%);
      background-image: var(--imagen-portada), linear-gradient(180deg, #1b2a49 0%, #6a4c93 45%, #ff9a5a 100%);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    /* capa oscura para que el texto se lea sobre cualquier foto */
    .hero::before {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,.35), rgba(0,0,0,.55));
    }
    .hero-text {
      position: relative; z-index: 2;
      padding-top: 70px; text-align: center;
      text-shadow: 0 2px 8px rgba(0,0,0,.55);
    }
    .hero-text h1 { font-weight: 800; letter-spacing: .5px; }

    /* ---------- Tarjeta ---------- */
    .form-card { margin-top: -70px; position: relative; z-index: 3; border: 0; border-radius: 1rem; }
    .form-card .card-header { border-radius: 1rem 1rem 0 0 !important; background: linear-gradient(90deg, #2e7d32, #66bb6a); }
    .section-title {
      color: var(--verde); font-weight: 700;
      border-bottom: 2px solid var(--verde-claro);
      padding-bottom: .4rem; margin-bottom: 1rem;
    }
    .form-control, .form-select { border-radius: .6rem; border: 1.5px solid #cfd8cf; }
    .form-control:focus, .form-select:focus {
      border-color: var(--verde); box-shadow: 0 0 0 .25rem rgba(46,125,50,.2);
    }

    /* ---------- Lista de opciones (select múltiple) ---------- */
    .form-select[multiple] { padding: .4rem; }
    .form-select[multiple] option {
      padding: .6rem .8rem; margin-bottom: 4px;
      border-radius: .5rem; background: #f7faf7;
    }
    .form-select[multiple] option:hover { background: var(--verde-claro); }
    .form-select[multiple] option:checked {
      background: var(--verde) linear-gradient(0deg, var(--verde), var(--verde)); color: #fff;
    }

    /* ---------- Radios como botones ---------- */
    .radio-group .btn {
      border-radius: 2rem; padding: .55rem 1.2rem; font-weight: 600;
      border: 2px solid var(--verde); color: var(--verde); transition: all .2s;
    }
    .radio-group .btn:hover { transform: translateY(-2px); background: var(--verde-claro); color: var(--verde); }
    .radio-group .btn-check:checked + .btn {
      background: var(--verde); color: #fff; box-shadow: 0 4px 10px rgba(46,125,50,.35);
    }
    .radio-group .btn-check:checked + .btn::before { content: "✔ "; }
    .radio-group .btn-check:focus-visible + .btn { box-shadow: 0 0 0 .25rem rgba(46,125,50,.3); }

    /* ---------- Checkboxes como tarjetas ---------- */
    .service-option {
      display: block; border: 2px solid #d7e3d7; border-radius: .8rem;
      padding: .75rem 1rem .75rem 2.8rem; background: #fff;
      cursor: pointer; transition: all .2s; position: relative; margin-bottom: .6rem;
    }
    .service-option:hover { border-color: var(--verde); background: var(--verde-claro); }
    .service-option input {
      position: absolute; left: 1rem; top: 50%; transform: translateY(-50%);
      width: 1.25rem; height: 1.25rem; accent-color: var(--verde); cursor: pointer;
    }
    .service-option:has(input:checked) {
      border-color: var(--verde); background: var(--verde-claro);
      box-shadow: 0 3px 8px rgba(46,125,50,.2); font-weight: 600;
    }

    /* ---------- Botones ---------- */
    .btn-enviar {
      background: linear-gradient(90deg, var(--lava), #ff9a3c); border: 0; color: #fff;
      font-weight: 700; border-radius: 2rem; padding: .6rem 2rem;
    }
    .btn-enviar:hover { color: #fff; filter: brightness(1.08); transform: translateY(-2px); }
  </style>
</head>
<body>

<!-- ======= PORTADA CON IMAGEN ======= -->
<header class="hero">
  <div class="hero-text container">
    <h1 class="display-5">Formulario para excursion al volcan Cotopaxi</h1>
    <p class="lead mb-0">Completa tu registro y prepárate para la aventura</p>
  </div>
</header>

<div class="container pb-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">

      <div class="card shadow form-card">
        <div class="card-header text-white text-center py-3">
          <h2 class="h4 mb-0">Formulario de registro</h2>
        </div>

        <div class="card-body p-4">
          <form action="/action_page.php" method="post">

            <!-- Datos personales -->
            <h5 class="section-title">Datos personales</h5>
            <div class="row g-3 mb-4">
              <div class="col-md-5">
                <label for="fname" class="form-label">Primer nombre</label>
                <input type="text" class="form-control" id="fname" name="fname" required>
              </div>
              <div class="col-md-5">
                <label for="lname" class="form-label">Primer apellido</label>
                <input type="text" class="form-control" id="lname" name="lname" required>
              </div>
              <div class="col-md-2">
                <label for="edad" class="form-label">Edad</label>
                <input type="number" class="form-control" id="edad" name="edad" min="0" max="120">
              </div>
            </div>

            <!-- Visita -->
            <h5 class="section-title">Detalles de la visita</h5>
            <div class="mb-3">
              <label for="visita" class="form-label">¿Cómo realizas tu visita?</label>
              <select class="form-select" id="visita" name="visita" size="5" multiple>
                <option value="solo">Solo</option>
                <option value="en pareja">En pareja</option>
                <option value="familiar">Con algún familiar</option>
                <option value="amigos">Grupo de amigos</option>
                <option value="tour">Tour organizado</option>
              </select>
              <div class="form-text">Mantén presionada Ctrl para elegir más de una opción.</div>
            </div>

            <div class="row g-3 mb-4">
              <div class="col-md-6">
                <label for="fechallegada" class="form-label">Fecha de llegada</label>
                <input type="date" class="form-control" id="fechallegada" name="fechallegada">
              </div>
              <div class="col-md-6">
                <label for="fecharegreso" class="form-label">Fecha de salida</label>
                <input type="date" class="form-control" id="fecharegreso" name="fecharegreso">
              </div>
            </div>

            <!-- Transporte (radios estilo botón) -->
            <div class="mb-4 radio-group">
              <label class="form-label d-block">Medio de transporte utilizado para llegar</label>
              <div class="d-flex flex-wrap gap-2">
                <input type="radio" class="btn-check" name="transporte" id="vehiculoparticular" value="vehiculoparticular" autocomplete="off">
                <label class="btn" for="vehiculoparticular">🚗 Vehículo particular</label>

                <input type="radio" class="btn-check" name="transporte" id="transportepublico" value="transportepublico" autocomplete="off">
                <label class="btn" for="transportepublico">🚌 Transporte público</label>

                <input type="radio" class="btn-check" name="transporte" id="motocicleta" value="motocicleta" autocomplete="off">
                <label class="btn" for="motocicleta">🏍️ Motocicleta</label>
              </div>
            </div>

            <!-- Servicios (checkboxes estilo tarjeta) -->
            <div class="mb-4">
              <label class="form-label d-block">Servicios que utilizará dentro de la visita</label>
              <div class="row">
                <div class="col-sm-6">
                  <label class="service-option" for="s1">
                    <input type="checkbox" id="s1" name="servicios" value="higiene"> 🚻 Servicios higiénicos
                  </label>
                  <label class="service-option" for="s2">
                    <input type="checkbox" id="s2" name="servicios" value="cafe"> ☕ Cafetería
                  </label>
                </div>
                <div class="col-sm-6">
                  <label class="service-option" for="s3">
                    <input type="checkbox" id="s3" name="servicios" value="estacionamiento"> 🅿️ Estacionamiento
                  </label>
                  <label class="service-option" for="s4">
                    <input type="checkbox" id="s4" name="servicios" value="guia"> 🧭 Servicio de guía turístico
                  </label>
                </div>
              </div>
            </div>

            <!-- Contacto -->
            <h5 class="section-title">Contacto</h5>
            <div class="row g-3 mb-4">
              <div class="col-md-6">
                <label for="email" class="form-label">Email para enviar la confirmación</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="correo@ejemplo.com">
              </div>
              <div class="col-md-6">
                <label for="phone" class="form-label">Número de teléfono</label>
                <input type="tel" class="form-control" id="phone" name="phone" placeholder="09-22145678"
                       pattern="[0-9]{2}-[0-9]{8}" required>
                <div class="form-text">Formato: 09-12345678</div>
              </div>
            </div>

            <!-- Comentario -->
            <div class="mb-4">
              <label for="message" class="form-label">¿Qué se podría mejorar del tour?</label>
              <textarea class="form-control" id="message" name="message" rows="5" placeholder="Escribe tu comentario aquí..."></textarea>
            </div>

            <div class="d-grid d-md-flex justify-content-md-end gap-2">
              <button type="reset" class="btn btn-outline-secondary rounded-pill px-4">Limpiar</button>
              <button type="submit" class="btn btn-enviar">Enviar</button>
            </div>

          </form>
        </div>
      </div>

    </div>
  </div>
</div>

</body>
</html>
